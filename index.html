<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Valorant Match Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>VALORANT CANLI MAÇ TAKİP</h1>

    <div class="search-box">
      <input type="text" id="riotIdInput" placeholder="Riot ID ve Tag (Örn: EMRE#VCG5)">
      <button id="searchBtn">Maç Ara</button>
    </div>

    <div class="teams-container">
      <div class="team-box blue-team">
        <h2>Mavi Takım</h2>
        <div id="blueTeamList"></div>
      </div>

      <div class="team-box red-team">
        <h2>Kırmızı Takım</h2>
        <div id="redTeamList"></div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
